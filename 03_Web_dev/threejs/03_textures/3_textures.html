<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script src="https://cdn.jsdelivr.net/npm/three@0.150.1/build/three.min.js"></script>
    <script>

        // Scene
        const scene = new THREE.Scene();

        // Camera
        const camera = new THREE.PerspectiveCamera(
            75,
            window.innerWidth/window.innerHeight,
            0.1,
            1000
        );
        camera.position.z = 5;

        // Renderer
        const renderer = new THREE.WebGLRenderer();
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        // Cube
        const geometry = new THREE.BoxGeometry(1, 1, 1);

        // Load texture
        const textureLoader = new THREE.TextureLoader();
        const texture = textureLoader.load('https://png.pngtree.com/background/20250103/original/pngtree-dark-wood-grain-texture-background---seamless-pattern-picture-image_15712210.jpg');

        // Applying image texture on a cube
        // MeshBasicMaterial does not change with light
        const material = new THREE.MeshBasicMaterial({map: texture})

        // Transparency mode :- (by setting opacity from 0 (fully transparent) to 1 (fully opaque))
        // const material = new THREE.MeshBasicMaterial({
        //     color: 0x00ff00,
        //     transparent: true,
        //     opacity: 0.2
        // });

        // Wire frame mode :- (Display the geometry of the object)
        // const material = new THREE.MeshBasicMaterial({
        //     color: 0x0000ff,
        //     wireframe: true
        // });

        const cube = new THREE.Mesh(geometry, material);
        scene.add(cube);

        // Animation loop
        function animate(){
            requestAnimationFrame(animate);

            cube.rotation.x += 0.01;
            cube.rotation.y += 0.01;
            
            renderer.render(scene, camera);
        }

        animate();

    </script>    
</body>
</html>
