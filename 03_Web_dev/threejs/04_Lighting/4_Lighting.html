<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script src="https://cdn.jsdelivr.net/npm/three@0.150.1/build/three.min.js"></script>
    <script>

        // Scene
        const scene = new THREE.Scene();

        // Camera
        const camera = new THREE.PerspectiveCamera(
            75,
            window.innerWidth/window.innerHeight,
            0.1,
            1000
        );
        camera.position.z = 5;

        // Renderer
        const renderer = new THREE.WebGLRenderer();
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        // Sphere
        const geometry = new THREE.SphereGeometry(1, 32, 32);
        // MeshPhongMaterial reacts to lights showing shiny highlights and smooth shading
        // Also :-
        // MeshBasicMaterial ignores light because it ignores lighting calculation
        // MeshStandardMaterial reacts to light and is completely black if no light exists
        const material = new THREE.MeshPhongMaterial({
            color: 0x156289,
            shininess: 50
        });
        const sphere = new THREE.Mesh(geometry, material);
        scene.add(sphere);

        // AmbientLight -> This light shines equally on all objects from every direction (like daylight)
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.5);  // color, intensity
        scene.add(ambientLight);

        // DirectionalLight -> Shines in one direction, producing clear shadows and highlights (like sunglight)
        const directionalLight = new THREE.DirectionalLight(0xffffff, 1);
        directionalLight.position.set(5, 10, 7); //x, y, z position
        scene.add(directionalLight);

        // PointLight -> Shines in all directions from a single point and fades as it gets farther (like light blub)
        const pointLight = new THREE.PointLight(0xff0000, 1, 100); // color red, intensity, distance
        pointLight.position.set(-5, 3, 5);
        scene.add(pointLight);

        // helpers show light positions visually (usefull for debugging)
        const directionalLightHelper = new THREE.DirectionalLightHelper(directionalLight, 1);
        scene.add(directionalLightHelper);

        const pointLightHelper = new THREE.PointLightHelper(pointLight, 1);
        scene.add(pointLightHelper);

        // Animation Loop
        function animate(){
            requestAnimationFrame(animate);

            sphere.rotation.x += 0.01;
            sphere.rotation.y += 0.01;
            pointLight.position.y +=0.01;
            directionalLight.position.x += 0.01;
            
            renderer.render(scene, camera);
        }

        animate();

    </script>
    
</body>
</html>
