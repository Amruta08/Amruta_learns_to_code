<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script src="https://cdn.jsdelivr.net/npm/three@0.150.1/build/three.min.js"></script>
    <script>
        // Scene
        const scene = new THREE.Scene();

        // Camera
        const camera = new THREE.PerspectiveCamera(
            75,
            window.innerWidth/window.innerHeight,
            0.1,
            1000
        );
        camera.position.z = 5;

        // Renderer
        const renderer = new THREE.WebGLRenderer();
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        // Group -> Container that holds several objects
        const group = new THREE.Group();

        // Create 2 cubes
        const geometry = new THREE.BoxGeometry(1, 1, 1);

        const textureLoader = new THREE.TextureLoader();

        const wood_texture = textureLoader.load('https://png.pngtree.com/background/20250103/original/pngtree-dark-wood-grain-texture-background---seamless-pattern-picture-image_15712210.jpg');
        const material_1 = new THREE.MeshBasicMaterial({map: wood_texture})

        const grass_texture = textureLoader.load('https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTF3AD5c_UQdMenycuph4xjxFXwGsElUCYjCw&s');
        const material_2 = new THREE.MeshBasicMaterial({map: grass_texture});

        const cube_1 = new THREE.Mesh(geometry, material_1);
        const cube_2 = new THREE.Mesh(geometry, material_2);

        cube_2.position.x = 2; // position the 2nd cube 2 units to the right

        // Add cubes to the group
        group.add(cube_1);
        group.add(cube_2);

        // Add the group to the scene
        scene.add(group)

        // Move the entire group by 1 unit
        group.position.y = 1;


        // Add axes helper which shows the x, y and z axes
        const axesHelper = new THREE.AxesHelper(5);
        scene.add(axesHelper);

        // Add Gridhelper to display a grid on the ground to help judge scale and obj. placement
        const gridHelper = new THREE.GridHelper(10, 10);
        scene.add(gridHelper);

        // Add axes helper inside the group to visualize group orientation
        const groupAxes = new THREE.AxesHelper(2);
        group.add(groupAxes);

        // Animation loop
        function animate(){
            requestAnimationFrame(animate);

            cube_1.rotation.x += 0.01;
            cube_1.rotation.y += 0.01;

            cube_2.rotation.x += 0.03;
            cube_2.rotation.y += 0.03;
            
            renderer.render(scene, camera);
        }

        animate();
    </script>
    
</body>
</html>
