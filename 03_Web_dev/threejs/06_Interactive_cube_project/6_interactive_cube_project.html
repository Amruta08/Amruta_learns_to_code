<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script src="https://cdn.jsdelivr.net/npm/three@0.150.1/build/three.min.js"></script>
    <script>
        // Create scene and Camera
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(
            75,
            window.innerWidth/window.innerHeight,
            0.1,
            1000
        );
        camera.position.z = 5;

        // Create renderer and add it to the page
        const renderer = new THREE.WebGLRenderer();
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        // Load texture
        const textureLoader = new THREE.TextureLoader();
        const texture = textureLoader.load('https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRjNwLfrcWNZMTDM30pU6HPrj8OtUzTDB74AA&s');

        // Create cube geometry and material
        const geometry = new THREE.BoxGeometry(3, 3, 3);
        const material = new THREE.MeshBasicMaterial({map: texture});

        // Create the cube mesh and add it to the scene
        const cube = new THREE.Mesh(geometry, material);
        scene.add(cube);

        // Add Lighting
        const pointLight = new THREE.PointLight(0xffffff);
        scene.add(pointLight);

    
        // State variables
        let isDragging = false;
        let previousMousePosition = {x:0, y:0};

        // Detect mouse down
        renderer.domElement.addEventListener('mousedown', ()=>{
            isDragging = true;
        })
        
        // Detect mouse up
        renderer.domElement.addEventListener('mouseup', ()=>{
            isDragging = false;
        })
        
        // Detect mouse move and rotate the cube
        renderer.domElement.addEventListener('mousemove', (event)=>{
            if(isDragging){

                // Calculate how much did the mouse move since last frame ?
                const deltaMove = {
                    x: event.clientX - previousMousePosition.x,
                    y: event.clientY - previousMousePosition.y
                };

                // Convert mouse movement to rotation
                cube.rotation.y += deltaMove.x * 0.005;
                cube.rotation.x += deltaMove.y * 0.005;
            }

            // Update previous postion
            previousMousePosition = {x: event.clientX, y:event.clientY};
        });

        // Animation loop
        function animate(){
            requestAnimationFrame(animate);
            // Rotate the cube
            cube.rotation.x += 0.01;
            cube.rotation.y += 0.01;

            // Make light follow the cube
            pointLight.position.copy(cube.position).add(new THREE.Vector3(2,2,2));
            
            renderer.render(scene, camera);
        }

        animate();
    </script>
    
</body>
</html>
