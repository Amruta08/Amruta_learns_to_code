<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script src="https://cdn.jsdelivr.net/npm/three@0.150.1/build/three.min.js"></script>
    <script>

        // Scene
        const scene = new THREE.Scene();

        // Camera
        const camera = new THREE.PerspectiveCamera(
            75,
            window.innerWidth/window.innerHeight,
            0.1,
            1000
        );
        camera.position.z = 5;

        // Renderer
        const renderer = new THREE.WebGLRenderer();
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        // Sphere
        const geometry = new THREE.TorusGeometry(2, 0.5, 16, 100);
        const material = new THREE.MeshStandardMaterial({
            color: 0x156289,
            shininess: 50
        });
        const torus = new THREE.Mesh(geometry, material);
        scene.add(torus);

        // DirectionalLight 
        const directionalLight = new THREE.DirectionalLight(0xffffff, 1);
        directionalLight.position.set(5, 10, 7); //x, y, z position
        scene.add(directionalLight);

        // 1. Postion -> moving objects
        torus.position.x = 2;  // move right
        torus.position.y = 1;  // move up
        torus.position.z = -3; // move deeper

        // or
        torus.position.set(2, 1, -3);


        // 2. Rotation -> Turning objects
        torus.rotation.x = Math.PI / 4;    // rotate 45° around X axis
        torus.rotation.y = Math.PI / 2;    // rotate 90° around X axis


        // 3. Scale -> Resizing objects
        torus.scale.set(2, 1, 1);


        // Animation Loop
        function animate(){
            requestAnimationFrame(animate);

            torus.rotation.x += 0.01;
            torus.rotation.y += 0.01;
            
            renderer.render(scene, camera);
        }

        animate();

    </script>
    
</body>
</html>
