<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script src="https://cdn.jsdelivr.net/npm/three@0.150.1/build/three.min.js"></script>
    <script>

        // Scene
        const scene = new THREE.Scene();

        // Camera
        const camera = new THREE.PerspectiveCamera(
            75,
            window.innerWidth/window.innerHeight,
            0.1,
            1000
        );
        camera.position.set(0, 10, 10);
        camera.lookAt(0, 0, 0);

        // Renderer
        const renderer = new THREE.WebGLRenderer();
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        // Lighting
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.5); 
        scene.add(ambientLight);
        
        const sunLight = new THREE.DirectionalLight(0xffffff, 1);
        sunLight.position.set(10, 20, 10); 
        scene.add(sunLight);

        // Axes Helper
        const axesHelper = new THREE.AxesHelper(5);
        scene.add(axesHelper);

        // Create vector
        const vec1 = new THREE.Vector3(3, 0, 4);

        // Arrowhelper (direction, origin, length, color)
        const redArrow = new THREE.ArrowHelper(
            vec1.clone(),
            new THREE.Vector3(0,0,0),
            vec1.length(),
            0xff0000
        );
        scene.add(redArrow);

        // Modified vector
        let ModifiedVector = vec1.clone();

        // Normalize
        //ModifiedVector.normalize();

        // Multiply Scalar
        //ModifiedVector.multiplyScalar(2);

        // Add another vector
        ModifiedVector.add(new THREE.Vector3(1, 0, 0));


        // Display modified vector
        const greenArrow = new THREE.ArrowHelper(
            ModifiedVector.clone(),
            new THREE.Vector3(0,0,0),
            ModifiedVector.length(),
            0x00ff00
        );
        scene.add(greenArrow);


        // Animation Loop
        function animate(){
            requestAnimationFrame(animate);
            redArrow.rotate +=0.01;
            renderer.render(scene, camera);
        }

        animate();

    </script>
    
</body>
</html>
