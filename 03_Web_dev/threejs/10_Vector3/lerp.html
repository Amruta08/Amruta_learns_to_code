<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script src="https://cdn.jsdelivr.net/npm/three@0.150.1/build/three.min.js"></script>
    <script>

        // Scene
        const scene = new THREE.Scene();

        // Camera
        const camera = new THREE.PerspectiveCamera(
            75,
            window.innerWidth/window.innerHeight,
            0.1,
            1000
        );
        camera.position.set(0, 5, 10);
        camera.lookAt(0, 0, 0);

        // Renderer
        const renderer = new THREE.WebGLRenderer();
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        // Lighting
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.5); 
        scene.add(ambientLight);
        
        const sunLight = new THREE.DirectionalLight(0xffffff, 1);
        sunLight.position.set(10, 20, 10); 
        scene.add(sunLight);

        // Axes Helper
        const axesHelper = new THREE.AxesHelper(5);
        scene.add(axesHelper);


        // Blue Sphere -> Start
        blue_sphere = new THREE.SphereGeometry(0.3);
        material_1 = new THREE.MeshStandardMaterial({color:0x0000ff});
        start_sphere = new THREE.Mesh(blue_sphere, material_1);
        start_sphere.position.set(0,0,0);
        scene.add(start_sphere);

        // Red Sphere -> Target
        red_sphere = new THREE.SphereGeometry(0.3);
        material_2 = new THREE.MeshStandardMaterial({color:0xff0000});
        target_sphere = new THREE.Mesh(red_sphere, material_2);
        target_sphere.position.set(5,0,0);
        scene.add(target_sphere);

        // Green Sphere -> Moving object
        green_sphere = new THREE.SphereGeometry(0.3);
        material_3 = new THREE.MeshStandardMaterial({color:0x00ff00});
        moving_sphere = new THREE.Mesh(green_sphere, material_3);
        scene.add(moving_sphere);

        // Lerp Logic
        // lerp -> Moves a value gradually towards another value
        // Formula -> A = A + (B - A) * alpha
        // Where, A : initial point, B : final point
        // B - A : remaining distance to the target
        // alpha: Exponential decay parameter and its value lies between 0 and 1
        const current = new THREE.Vector3(0, 0, 0);
        const target = new THREE.Vector3(5, 0, 0);

        // Animation Loop
        function animate(){
            requestAnimationFrame(animate);
            current.lerp(target, 0.05);
            moving_sphere.position.copy(current);
            renderer.render(scene, camera);
        }

        animate();

    </script>
    
</body>
</html>
